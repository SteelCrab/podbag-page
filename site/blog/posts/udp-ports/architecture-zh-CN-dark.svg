<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-label="容器 udp-server 在 UDP 端口 9999 上监听并发布 127.0.0.1:18111/udp；主机网络上的客户端向该地址发送数据报，podbag logs 显示它" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Apple SD Gothic Neo', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK KR', sans-serif">
<title>容器 udp-server 在 UDP 端口 9999 上监听并发布 127.0.0.1:18111/udp；主机网络上的客户端向该地址发送数据报，podbag logs 显示它</title>
<defs><marker id="head-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a988f"/></marker><marker id="tail-arrow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a988f"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3987e5"/></marker><marker id="tail-accent" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3987e5"/></marker><marker id="head-podbag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b88ae0"/></marker><marker id="tail-podbag" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b88ae0"/></marker><marker id="head-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="tail-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker></defs>
<rect width="960" height="330" rx="12" fill="#1a1a19"/>
<rect x="20" y="20" width="250" height="290" rx="12" fill="#141413" stroke="#45453f"/>
<text x="38" y="48" font-size="15" fill="#f0efec" font-weight="700" text-anchor="start">你的电脑</text>
<rect x="300" y="20" width="640" height="290" rx="12" fill="#141413" stroke="#45453f" stroke-dasharray="6 5"/>
<text x="318" y="48" font-size="15" fill="#f0efec" font-weight="700" text-anchor="start">练习环境</text>
<text x="318" y="67" font-size="11.5" fill="#c3c2b7" text-anchor="start">临时环境：输入 exit 后删除</text>
<rect x="40" y="80" width="210" height="56" rx="8" fill="#242422" stroke="#45453f" stroke-width="1.4"/>
<text x="54" y="105.0" font-size="14" fill="#f0efec" font-weight="600" text-anchor="start">终端</text>
<text x="54" y="123.0" font-size="11.5" fill="#c3c2b7" text-anchor="start">podbag run · ps · logs</text>
<rect x="330" y="214" width="250" height="64" rx="8" fill="#242422" stroke="#45453f" stroke-width="1.4"/>
<text x="344" y="243.0" font-size="14" fill="#f0efec" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">nc -u (--rm)</text>
<text x="344" y="261.0" font-size="11.5" fill="#c3c2b7" text-anchor="start">主机网络</text>
<rect x="630" y="96" width="280" height="104" rx="8" fill="#242422" stroke="#45453f" stroke-width="1.4"/>
<text x="644" y="145.0" font-size="14" fill="#f0efec" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="start">udp-server</text>
<text x="644" y="163.0" font-size="11.5" fill="#c3c2b7" text-anchor="start">nc -u -l -p 9999</text>
<rect x="749" y="170" width="151" height="20" rx="10" fill="#3987e5"/>
<text x="824.5" y="184" font-size="11" fill="#ffffff" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">127.0.0.1:18111/udp</text>
<line x1="580" y1="236" x2="680" y2="204" stroke="#3987e5" stroke-width="1.6" marker-end="url(#head-accent)"/>
<text x="636.0" y="240.0" font-size="11.5" fill="#c3c2b7" text-anchor="start">数据报</text>
<line x1="250" y1="108" x2="626" y2="130" stroke="#9a988f" stroke-width="1.6" marker-end="url(#head-arrow)"/>
<text x="532.0" y="114.5" font-size="11.5" fill="#c3c2b7" text-anchor="middle">日志</text>
<line x1="250" y1="120" x2="326" y2="240" stroke="#b88ae0" stroke-width="1.6" marker-end="url(#head-podbag)"/>
</svg>
