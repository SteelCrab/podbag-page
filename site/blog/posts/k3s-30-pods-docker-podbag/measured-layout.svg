<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="measured-layout-title measured-layout-desc"><title id="measured-layout-title">Measured k3s topology</title><desc id="measured-layout-desc">One node runs the load client, six web proxies and twenty-four API backends. Only one runtime runs at a time.</desc><defs><style>text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;fill:#172b40} .title{font-weight:700;font-size:24px}.main{font-weight:650;font-size:20px}.small{font-size:16px;fill:#3e5366}.zone{font-weight:650;font-size:17px;fill:#126477}.path{fill:none;stroke:#43586b;stroke-width:2.3;marker-end:url(#arrow)}.box{fill:white;stroke:#98aeba;stroke-width:1.5}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43586b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafb"/><rect x="16" y="16" width="728" height="288" rx="6" fill="white" stroke="#70889a"/><text x="40" y="58" class="title">Linux VM · k3s</text><text x="40" y="91" class="small">1 node · 4 vCPU · 4 GiB</text><rect x="40" y="121" width="196" height="82" rx="7" fill="#f2f7fc" stroke="#7593ac"/><text x="138" y="154" text-anchor="middle" class="main">HTTP client</text><text x="138" y="183" text-anchor="middle" class="small">12 clients</text><rect x="282" y="121" width="196" height="82" rx="7" fill="#f2f7fc" stroke="#7593ac"/><text x="380" y="154" text-anchor="middle" class="main">web × 6</text><text x="380" y="183" text-anchor="middle" class="small">ClusterIP</text><rect x="524" y="121" width="196" height="82" rx="7" fill="#f2f7fc" stroke="#7593ac"/><text x="622" y="154" text-anchor="middle" class="main">API × 24</text><text x="622" y="183" text-anchor="middle" class="small">ClusterIP</text><path class="path" d="M236 162 h40"/><path class="path" d="M478 162 h40"/><text x="40" y="246" class="small">kubelet → cri-dockerd → Docker Engine</text><text x="40" y="276" class="small">kubelet → Podbag CRI</text></svg>
