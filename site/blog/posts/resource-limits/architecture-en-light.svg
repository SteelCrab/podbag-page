<svg xmlns="http://www.w3.org/2000/svg" width="960" height="310" viewBox="0 0 960 310" role="img" aria-label="The container app runs in a cgroup with memory.max and cpu.max; podbag update raises the memory limit from 64 MiB to 128 MiB while it runs" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'Apple SD Gothic Neo', 'Hiragino Sans', 'PingFang SC', 'Noto Sans CJK KR', sans-serif">
<title>The container app runs in a cgroup with memory.max and cpu.max; podbag update raises the memory limit from 64 MiB to 128 MiB while it runs</title>
