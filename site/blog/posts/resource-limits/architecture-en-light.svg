<rect width="960" height="310" rx="12" fill="#fcfcfb"/>
<rect x="20" y="20" width="250" height="270" rx="12" fill="#ffffff" stroke="#c3c2b7"/>
<text x="38" y="48" font-size="15" fill="#0b0b0b" font-weight="700" text-anchor="start">Your computer</text>
