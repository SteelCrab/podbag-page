<text x="54" y="170.0" font-size="11.5" fill="#52514e" text-anchor="start">podbag run · exec</text>
<text x="54" y="188" font-size="11.5" fill="#52514e" text-anchor="start">stats · top · update</text>
<rect x="330" y="80" width="590" height="190" rx="12" fill="#eaf1fb" stroke="#2a78d6" stroke-dasharray="4 4"/>
