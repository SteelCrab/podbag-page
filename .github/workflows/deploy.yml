name: Deploy

on:
  push:
    branches: [main]
  # Every day: new pictures, videos and install.sh in the podbag repository reach the site.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the podbag repository
        uses: actions/checkout@v4
        with:
          repository: SteelCrab/podbag
          path: podbag
      - name: Build the pages
        run: PODBAG_REPO=podbag python3 dev/docs/site.py _site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the Cloudflare CLI
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Deploy to podbag.dev
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: site
        run: npx cf deploy ../_site
      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the site was built but not deployed."
